id = "testy-cool.herdr-sidebar"
name = "Herdr Sidebar Config"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Workspace, tab, and agent tree preset with compact single-tab groups, readable tasks, and provider icons."
platforms = ["linux", "macos", "windows"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "--restore-view"]

[[panes]]
id = "settings"
title = "Sidebar settings"
placement = "popup"
width = 68
height = 18
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "--settings"]

[[actions]]
id = "settings"
title = "Sidebar settings"
description = "Change sidebar preferences without restarting Herdr."
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "--settings-open"]

[[actions]]
id = "refresh"
title = "Refresh agent sidebar"
description = "Update headings, agent labels, and state indicators from the current session."
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[actions]]
id = "clear"
title = "Clear sidebar display tokens"
description = "Remove this plugin's generated display values before disabling it."
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["sh", "run.sh", "--clear"]

[[events]]
on = "pane.agent_detected"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "pane.closed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "pane.exited"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "pane.moved"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "tab.created"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "tab.moved"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "tab.closed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "workspace.renamed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "workspace.closed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "pane.focused"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "tab.focused"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

[[events]]
on = "tab.renamed"
platforms = ["linux", "macos"]
command = ["sh", "run.sh"]

# Herdr rejects duplicate action and pane ids even across platforms, so
# Windows uses the ids in host.ENTRIES. The '.\' prefix keeps cmd working
# when NoDefaultCurrentDirectoryInExePath is set.

[[startup]]
platforms = ["windows"]
command = ["cmd", "/c", '.\run.cmd', "--restore-view"]

[[panes]]
