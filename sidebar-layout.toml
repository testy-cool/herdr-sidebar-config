# Workspace -> tab -> agent layout; merge these sections into Herdr config.toml.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$hs_group", bold = true, dim = false, fg = "#A8ADB9" }, { token = "$hs_group_dim", dim = true, fg = "#A8ADB9" }],
  [{ token = "$hs_terminals", dim = true, fg = "#A8ADB9" }],
  [{ token = "$hs_tab", fg = "#A8ADB9", dim = false }, { token = "$hs_tab_dim", fg = "#A8ADB9", dim = true }],
  [
    { token = "$hs_row_working", fg = "#A8ADB9", dim = false },
    { token = "$hs_row_working_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_row_blocked", fg = "#F08080", dim = false },
    { token = "$hs_row_blocked_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_row_done", fg = "#91C788", dim = false },
    { token = "$hs_row_done_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_row_idle", fg = "#A8ADB9", dim = false },
    { token = "$hs_row_idle_dim", fg = "#A8ADB9", dim = true },
    { token = "$hs_row_unknown", fg = "#A8ADB9", dim = false },
    { token = "$hs_row_unknown_dim", fg = "#A8ADB9", dim = true },
    "machine",
    { token = "$hs_row_logo", fg = "#A8ADB9", dim = false },
    { token = "$hs_row_logo_kimchi", fg = "#FF521D", dim = false },
    { token = "$hs_row_logo_dim", fg = "#A8ADB9", dim = true },
  ],
  [{ token = "$hs_row_task", fg = "#A8ADB9", dim = false }, { token = "$hs_row_task_dim", fg = "#A8ADB9", dim = true }],
  [{ token = "$hs_gap" }],
]

